<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica, Arial, sans-serif"><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA4B2"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3DDC84"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF4D4D"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFB020"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4DA3FF"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B388FF"/></marker></defs><rect width="100%" height="100%" fill="#0E1116"/><circle cx="40" cy="450" r="14" fill="#E8EAED"/><path d="M56,450 L98,450" fill="none" stroke="#9AA4B2" stroke-width="3" marker-end="url(#m)"/><text x="60" y="418.0" font-size="13" fill="#9AA4B2" text-anchor="middle" font-weight="bold">power on</text><rect x="100.0" y="390.0" width="220" height="120" rx="16" fill="#171C24" stroke="#4DA3FF" stroke-width="3"/><text x="210" y="444.06" font-size="22" fill="#4DA3FF" font-weight="bold" text-anchor="middle">IDLE</text><text x="210" y="471.34" font-size="17" fill="#9AA4B2" font-weight="normal" text-anchor="middle">LCD: &quot;Press A&quot;</text><rect x="410.0" y="385.0" width="240" height="130" rx="16" fill="#171C24" stroke="#B388FF" stroke-width="3"/><text x="530" y="430.42" font-size="22" fill="#B388FF" font-weight="bold" text-anchor="middle">AI THINKING</text><text x="530" y="457.7" font-size="17" fill="#9AA4B2" font-weight="normal" text-anchor="middle">LLM writes riddles</text><text x="530" y="484.98" font-size="17" fill="#9AA4B2" font-weight="normal" text-anchor="middle">Python picks answers</text><rect x="740" y="150" width="490" height="610" rx="24" fill="#12161D" stroke="#FFB020" stroke-width="3"/><text x="985" y="188.0" font-size="22" fill="#FFB020" text-anchor="middle" font-weight="bold">PLAYING  ·  timer running</text><rect x="825.0" y="242.0" width="320" height="96" rx="16" fill="#171C24" stroke="#FFB020" stroke-width="3"/><text x="985" y="284.06" font-size="22" fill="#FFB020" font-weight="bold" text-anchor="middle">1 · WIRES</text><text x="985" y="311.34" font-size="17" fill="#9AA4B2" font-weight="normal" text-anchor="middle">pull the right wire</text><rect x="825.0" y="407.0" width="320" height="96" rx="16" fill="#171C24" stroke="#FFB020" stroke-width="3"/><text x="985" y="449.06" font-size="22" fill="#FFB020" font-weight="bold" text-anchor="middle">2 · CODE</text><text x="985" y="476.34" font-size="17" fill="#9AA4B2" font-weight="normal" text-anchor="middle">solve math, type 4 digits + #</text><rect x="825.0" y="572.0" width="320" height="96" rx="16" fill="#171C24" stroke="#FFB020" stroke-width="3" stroke-dasharray="10 7"/><text x="985" y="614.0600000000001" font-size="22" fill="#FFB020" font-weight="bold" text-anchor="middle">3 · CARDS</text><text x="985" y="641.34" font-size="17" fill="#9AA4B2" font-weight="normal" text-anchor="middle">scan RFID tags in order</text><path d="M985,338 L985,404" fill="none" stroke="#FFB020" stroke-width="3" marker-end="url(#a)"/><text x="1000" y="378.0" font-size="15" fill="#FFB020" text-anchor="start" font-weight="bold">right wire</text><path d="M985,503 L985,569" fill="none" stroke="#FFB020" stroke-width="3" marker-end="url(#a)"/><text x="1000" y="543.0" font-size="15" fill="#FFB020" text-anchor="start" font-weight="bold">right code</text><text x="985" y="712.0" font-size="15" fill="#9AA4B2" text-anchor="middle" font-weight="bold">any stage: wrong move = strike +1</text><text x="985" y="730.0" font-size="15" fill="#9AA4B2" text-anchor="middle" font-weight="bold">AI can send TIME ±30 · FREEZE · SKIP · STRIKE</text><rect x="1320.0" y="200.0" width="240" height="120" rx="16" fill="#171C24" stroke="#3DDC84" stroke-width="3"/><text x="1440" y="238.64000000000001" font-size="24" fill="#3DDC84" font-weight="bold" text-anchor="middle">DEFUSED</text><text x="1440" y="268.4" font-size="19" fill="#9AA4B2" font-weight="normal" text-anchor="middle">servo lid opens</text><text x="1440" y="298.15999999999997" font-size="19" fill="#9AA4B2" font-weight="normal" text-anchor="middle">AI sulks</text><rect x="1320.0" y="630.0" width="240" height="120" rx="16" fill="#171C24" stroke="#FF4D4D" stroke-width="3"/><text x="1440" y="668.64" font-size="24" fill="#FF4D4D" font-weight="bold" text-anchor="middle">BOOM</text><text x="1440" y="698.4" font-size="19" fill="#9AA4B2" font-weight="normal" text-anchor="middle">buzzer + skull face</text><text x="1440" y="728.16" font-size="19" fill="#9AA4B2" font-weight="normal" text-anchor="middle">AI gloats</text><path d="M320,450 L406,450" fill="none" stroke="#4DA3FF" stroke-width="3" marker-end="url(#b)"/><text x="363" y="420.0" font-size="15" fill="#4DA3FF" text-anchor="middle" font-weight="bold">press A or</text><text x="363" y="488.0" font-size="15" fill="#4DA3FF" text-anchor="middle" font-weight="bold">&quot;let&#x27;s play&quot;</text><path d="M650,450 L700,450 L700,290 L822,290" fill="none" stroke="#B388FF" stroke-width="3" marker-end="url(#p)"/><text x="695" y="254.0" font-size="16" fill="#B388FF" text-anchor="end" font-weight="bold">NEW + GO</text><text x="560" y="553.0" font-size="13" fill="#9AA4B2" text-anchor="start" font-weight="bold">AI too slow (&gt;20 s)</text><text x="560" y="571.0" font-size="13" fill="#9AA4B2" text-anchor="start" font-weight="bold">→ offline puzzle</text><path d="M1145,620 L1265,620 L1265,260 L1316,260" fill="none" stroke="#3DDC84" stroke-width="3" marker-end="url(#g)"/><path d="M1145,455 L1265,455" stroke="#3DDC84" stroke-width="3" stroke-dasharray="9 7" fill="none"/><text x="1278" y="410.0" font-size="16" fill="#3DDC84" text-anchor="start" font-weight="bold">solved</text><text x="1278" y="480.0" font-size="13" fill="#9AA4B2" text-anchor="start" font-weight="bold">(no RFID:</text><text x="1278" y="495.6" font-size="13" fill="#9AA4B2" text-anchor="start" font-weight="bold">code is last)</text><path d="M1230,700 L1316,700" fill="none" stroke="#FF4D4D" stroke-width="3" marker-end="url(#r)"/><text x="1273" y="744.0" font-size="15" fill="#FF4D4D" text-anchor="middle" font-weight="bold">3rd strike</text><text x="1273" y="762.0" font-size="15" fill="#FF4D4D" text-anchor="middle" font-weight="bold">or 0:00</text><path d="M1440,198 L1440,85 L530,85 L530,383" fill="none" stroke="#3DDC84" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#g)"/><text x="985" y="72.0" font-size="17" fill="#3DDC84" text-anchor="middle" font-weight="bold">say &quot;play again&quot; or press A  →  ABORT + new puzzle</text><path d="M1440,752 L1440,840 L530,840 L530,517" fill="none" stroke="#FF4D4D" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#r)"/><text x="985" y="870.0" font-size="17" fill="#FF4D4D" text-anchor="middle" font-weight="bold">say &quot;play again&quot; or press A  →  ABORT + new puzzle</text></svg>