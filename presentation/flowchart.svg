<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" font-family="Helvetica, Arial, sans-serif"><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA4B2"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3DDC84"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF4D4D"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFB020"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4DA3FF"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B388FF"/></marker></defs><rect width="100%" height="100%" fill="#0E1116"/><rect x="35.0" y="60.0" width="230" height="100" rx="50" fill="#171C24" stroke="#4DA3FF" stroke-width="3"/><text x="150" y="90.42" font-size="22" fill="#4DA3FF" font-weight="bold" text-anchor="middle">START</text><text x="150" y="117.7" font-size="17" fill="#9AA4B2" font-weight="normal" text-anchor="middle">say &quot;let&#x27;s play&quot;</text><text x="150" y="144.98" font-size="17" fill="#9AA4B2" font-weight="normal" text-anchor="middle">or press A</text><polygon points="450,35.0 565.0,110 450,185.0 335.0,110" fill="#171C24" stroke="#FFB020" stroke-width="3"/><text x="450" y="104.6" font-size="20" fill="#FFB020" font-weight="bold" text-anchor="middle">All 4 wires</text><text x="450" y="129.39999999999998" font-size="16" fill="#9AA4B2" font-weight="normal" text-anchor="middle">plugged in?</text><rect x="330.0" y="260.0" width="240" height="80" rx="16" fill="#171C24" stroke="#9AA4B2" stroke-width="3"/><text x="450" y="295.14" font-size="18" fill="#9AA4B2" font-weight="bold" text-anchor="middle">AI: &quot;Plug the red</text><text x="450" y="317.46" font-size="14" fill="#9AA4B2" font-weight="normal" text-anchor="middle">wire back in&quot;</text><rect x="640.0" y="55.0" width="300" height="110" rx="16" fill="#171C24" stroke="#B388FF" stroke-width="3"/><text x="790" y="91.31" font-size="21" fill="#B388FF" font-weight="bold" text-anchor="middle">AI writes riddles</text><text x="790" y="117.35" font-size="16" fill="#9AA4B2" font-weight="normal" text-anchor="middle">Python picks the answers</text><text x="790" y="143.39000000000001" font-size="16" fill="#9AA4B2" font-weight="normal" text-anchor="middle">(always solvable)</text><rect x="1015.0" y="55.0" width="330" height="110" rx="16" fill="#171C24" stroke="#FFB020" stroke-width="3"/><text x="1180" y="90.42" font-size="22" fill="#FFB020" font-weight="bold" text-anchor="middle">Timer starts</text><text x="1180" y="117.7" font-size="17" fill="#9AA4B2" font-weight="normal" text-anchor="middle">AI speaks the clue</text><text x="1180" y="144.98" font-size="17" fill="#9AA4B2" font-weight="normal" text-anchor="middle">LCD shows it</text><polygon points="1180,285.0 1340.0,370 1180,455.0 1020.0,370" fill="#171C24" stroke="#FFB020" stroke-width="3"/><text x="1180" y="364.33000000000004" font-size="21" fill="#FFB020" font-weight="bold" text-anchor="middle">What does the</text><text x="1180" y="390.37000000000006" font-size="16" fill="#9AA4B2" font-weight="normal" text-anchor="middle">player do?</text><rect x="1340.0" y="295.0" width="240" height="150" rx="16" fill="#171C24" stroke="#B388FF" stroke-width="3"/><text x="1460" y="352.2" font-size="20" fill="#B388FF" font-weight="bold" text-anchor="middle">AI GAME MASTER</text><text x="1460" y="377.0" font-size="16" fill="#9AA4B2" font-weight="normal" text-anchor="middle">±30 s · hint · freeze</text><text x="1460" y="401.8" font-size="16" fill="#9AA4B2" font-weight="normal" text-anchor="middle">skip · strike · dare</text><polygon points="1180,550.0 1310.0,620 1180,690.0 1050.0,620" fill="#171C24" stroke="#FFB020" stroke-width="3"/><text x="1180" y="627.7" font-size="22" fill="#FFB020" font-weight="bold" text-anchor="middle">Correct?</text><polygon points="790,550.0 920.0,620 790,690.0 660.0,620" fill="#171C24" stroke="#FFB020" stroke-width="3"/><text x="790" y="627.7" font-size="22" fill="#FFB020" font-weight="bold" text-anchor="middle">Last stage?</text><rect x="1345.0" y="570.0" width="230" height="100" rx="16" fill="#171C24" stroke="#FF4D4D" stroke-width="3"/><text x="1460" y="601.3100000000001" font-size="21" fill="#FF4D4D" font-weight="bold" text-anchor="middle">STRIKE +1</text><text x="1460" y="627.35" font-size="16" fill="#9AA4B2" font-weight="normal" text-anchor="middle">buzzer · red LED</text><text x="1460" y="653.3900000000001" font-size="16" fill="#9AA4B2" font-weight="normal" text-anchor="middle">AI taunts</text><rect x="660.0" y="770.0" width="260" height="100" rx="16" fill="#171C24" stroke="#3DDC84" stroke-width="3"/><text x="790" y="813.52" font-size="24" fill="#3DDC84" font-weight="bold" text-anchor="middle">DEFUSED</text><text x="790" y="843.28" font-size="19" fill="#9AA4B2" font-weight="normal" text-anchor="middle">lid opens</text><rect x="1345.0" y="770.0" width="230" height="100" rx="16" fill="#171C24" stroke="#FF4D4D" stroke-width="3"/><text x="1460" y="813.52" font-size="24" fill="#FF4D4D" font-weight="bold" text-anchor="middle">BOOM</text><text x="1460" y="843.28" font-size="19" fill="#9AA4B2" font-weight="normal" text-anchor="middle">3 strikes or 0:00</text><rect x="35.0" y="770.0" width="230" height="100" rx="50" fill="#171C24" stroke="#4DA3FF" stroke-width="3"/><text x="150" y="827.7" font-size="22" fill="#4DA3FF" font-weight="bold" text-anchor="middle">Play again?</text><path d="M265,110 L333,110" fill="none" stroke="#4DA3FF" stroke-width="3" marker-end="url(#b)"/><path d="M566,110 L638,110" fill="none" stroke="#3DDC84" stroke-width="3" marker-end="url(#g)"/><text x="600" y="96.0" font-size="15" fill="#3DDC84" text-anchor="middle" font-weight="bold">yes</text><path d="M450,186 L450,258" fill="none" stroke="#FF4D4D" stroke-width="3" marker-end="url(#r)"/><text x="465" y="226.0" font-size="15" fill="#FF4D4D" text-anchor="start" font-weight="bold">no</text><path d="M330,300 L200,300 L200,162" fill="none" stroke="#9AA4B2" stroke-width="3" marker-end="url(#m)"/><path d="M941,110 L1013,110" fill="none" stroke="#B388FF" stroke-width="3" marker-end="url(#p)"/><path d="M1180,166 L1180,283" fill="none" stroke="#FFB020" stroke-width="3" marker-end="url(#a)"/><path d="M1340,370 L1340,370" /><text x="1340" y="300.0" font-size="15" fill="#B388FF" text-anchor="middle" font-weight="bold">talks</text><path d="M1460,294 L1460,110 L1347,110" fill="none" stroke="#B388FF" stroke-width="3" marker-end="url(#p)"/><text x="1472" y="210.0" font-size="14" fill="#B388FF" text-anchor="start" font-weight="bold">speaks reply,</text><text x="1472" y="226.8" font-size="14" fill="#B388FF" text-anchor="start" font-weight="bold">changes the bomb</text><path d="M1180,456 L1180,548" fill="none" stroke="#FFB020" stroke-width="3" marker-end="url(#a)"/><text x="1195" y="510.0" font-size="15" fill="#FFB020" text-anchor="start" font-weight="bold">pulls wire / types code / scans card</text><path d="M1050,620 L922,620" fill="none" stroke="#3DDC84" stroke-width="3" marker-end="url(#g)"/><text x="985" y="606.0" font-size="15" fill="#3DDC84" text-anchor="middle" font-weight="bold">yes</text><path d="M1310,620 L1343,620" fill="none" stroke="#FF4D4D" stroke-width="3" marker-end="url(#r)"/><text x="1326" y="606.0" font-size="15" fill="#FF4D4D" text-anchor="middle" font-weight="bold">no</text><path d="M790,550 L790,370 L1018,370" fill="none" stroke="#FFB020" stroke-width="3" marker-end="url(#a)"/><text x="805" y="460.0" font-size="15" fill="#FFB020" text-anchor="start" font-weight="bold">no: next stage,</text><text x="805" y="478.0" font-size="15" fill="#FFB020" text-anchor="start" font-weight="bold">AI reads new clue</text><path d="M790,690 L790,768" fill="none" stroke="#3DDC84" stroke-width="3" marker-end="url(#g)"/><text x="805" y="735.0" font-size="15" fill="#3DDC84" text-anchor="start" font-weight="bold">yes</text><path d="M1460,670 L1460,768" fill="none" stroke="#FF4D4D" stroke-width="3" marker-end="url(#r)"/><text x="1475" y="725.0" font-size="15" fill="#FF4D4D" text-anchor="start" font-weight="bold">3rd strike</text><path d="M1575,600 L1590,600 L1590,470 L1560,450" fill="none" stroke="#FF4D4D" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#r)"/><text x="1588" y="540.0" font-size="14" fill="#FF4D4D" text-anchor="end" font-weight="bold">&lt; 3</text><text x="1120" y="920.0" font-size="16" fill="#FF4D4D" text-anchor="middle" font-weight="bold">timer reaches 0:00 at any time  →  BOOM</text><path d="M658,820 L267,820" fill="none" stroke="#3DDC84" stroke-width="3" marker-end="url(#g)"/><path d="M1345,820 L1300,880 L300,880 L240,860" fill="none" stroke="#FF4D4D" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#r)"/><path d="M100,768 L100,162" fill="none" stroke="#4DA3FF" stroke-width="3" marker-end="url(#b)"/><text x="88" y="470.0" font-size="15" fill="#4DA3FF" text-anchor="end" font-weight="bold">yes</text></svg>